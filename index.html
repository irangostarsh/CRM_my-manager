<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

      <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">


    <title>ورود | My Manager</title>

    <link rel="stylesheet" href="style index.css">
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>
    </div>


    <!-- Main -->
    <main class="auth-container">

        <section class="auth-card">

            <!-- Logo -->
            <div class="brand">

                <div class="brand-icon">
                    MM
                </div>

                <div class="brand-text">
                    <h1>My Manager</h1>
                    <span>مدیریت هوشمند کسب‌وکار</span>
                </div>

            </div>


            <!-- Header -->
            <div class="auth-header">

                <div class="welcome-icon">
                    <span id="headerIcon">🔐</span>
                </div>

                <h2 id="formTitle">
                    خوش آمدید
                </h2>

                <p id="formSubtitle">
                    برای ورود به حساب خود اطلاعاتتان را وارد کنید
                </p>

            </div>


            <!-- Messages -->
            <div
                id="message"
                class="message"
            ></div>


            <!-- Login -->
            <form
                id="loginForm"
                class="auth-form"
                autocomplete="on"
            >

                <div class="input-group">

                    <label for="loginUsername">
                        نام کاربری
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="loginUsername"
                            name="username"
                            placeholder="نام کاربری خود را وارد کنید"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="loginPassword">
                        رمز عبور
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="رمز عبور خود را وارد کنید"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="نمایش رمز"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    <span>ورود به حساب</span>
                    <span class="button-arrow">←</span>
                </button>

            </form>


            <!-- Register -->
            <form
                id="registerForm"
                class="auth-form hidden"
                autocomplete="on"
            >

                <div class="input-group">

                    <label for="registerUsername">
                        نام کاربری
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            type="text"
                            id="registerUsername"
                            name="username"
                            placeholder="یک نام کاربری انتخاب کنید"
                            autocomplete="username"
                            minlength="3"
                            maxlength="30"
                            required
                        >

                    </div>

                    <small>
                        حداقل ۳ کاراکتر
                    </small>

                </div>


                <div class="input-group">

                    <label for="registerPassword">
                        رمز عبور
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="یک رمز عبور انتخاب کنید"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="registerPassword"
                            aria-label="نمایش رمز"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="password-strength">

                    <div class="strength-bar">
                        <span id="strengthProgress"></span>
                    </div>

                    <span id="strengthText">
                        قدرت رمز عبور
                    </span>

                </div>


                <div class="input-group">

                    <label for="registerPasswordConfirm">
                        تکرار رمز عبور
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔐
                        </span>

                        <input
                            type="password"
                            id="registerPasswordConfirm"
                            name="passwordConfirm"
                            placeholder="رمز عبور را دوباره وارد کنید"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    <span>ساخت حساب کاربری</span>
                    <span class="button-arrow">←</span>
                </button>

            </form>


            <!-- Switch -->
            <div class="switch-auth">

                <span id="switchText">
                    حساب کاربری ندارید؟
                </span>

                <button
                    type="button"
                    id="switchButton"
                >
                    ثبت‌نام کنید
                </button>

            </div>


            <!-- Footer -->
            <div class="auth-footer">

                <span>
                    My Manager
                </span>

                <span class="separator">
                    •
                </span>

                <span>
                    نسخه 3.0.0
                </span>

            </div>

        </section>

    </main>


    <!-- Welcome Sound -->
    <audio
        id="welcomeSound"
        preload="auto"
    >
        <source
            src="welcome.mp3"
            type="audio/mpeg"
        >
    </audio>


    <script src="script.js"></script>


     <script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .then(registration => {
                console.log(
                    "My Manager Service Worker فعال شد:",
                    registration.scope
                );
            })
            .catch(error => {
                console.error(
                    "خطا در Service Worker:",
                    error
                );
            });

    });

}
</script>
</body>

</html>
